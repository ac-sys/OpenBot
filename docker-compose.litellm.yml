# Local-first LiteLLM model switchboard for OpenBot.
# Start with: docker compose -f docker-compose.litellm.yml up -d
# Exposes one OpenAI-compatible endpoint on http://127.0.0.1:4000/v1 routing
# across host Ollama (local-fast / local-smart), Gemini, and optional Groq.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: openbot-litellm
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-openbot-local-switchboard}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5
